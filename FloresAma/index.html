
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ramo de Flores 🌼</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="cielo">

        <!-- ESTRELLAS -->
        <div class="estrellas"></div>


        <!-- MENSAJE -->
        <div class="mensaje">

            <span>Un pequeño detalle</span>

            <h1>Para ti 🌼</h1>

            <p>
                Que nunca dejen de florecer
                los momentos bonitos.
            </p>

        </div>


        <!-- RAMO -->
        <div class="jardin">

            <!-- TALLOS -->
            <div class="tallo tallo1"></div>
            <div class="tallo tallo2"></div>
            <div class="tallo tallo3"></div>
            <div class="tallo tallo4"></div>
            <div class="tallo tallo5"></div>
            <div class="tallo tallo6"></div>
            <div class="tallo tallo7"></div>
            <div class="tallo tallo8"></div>
            <div class="tallo tallo9"></div>


            <!-- HOJAS -->
            <div class="hoja hoja1"></div>
            <div class="hoja hoja2"></div>
            <div class="hoja hoja3"></div>
            <div class="hoja hoja4"></div>
            <div class="hoja hoja5"></div>
            <div class="hoja hoja6"></div>
            <div class="hoja hoja7"></div>
            <div class="hoja hoja8"></div>


            <!-- LAS FLORES SE CREAN CON JAVASCRIPT -->

            <div id="ramo-flores"></div>

        </div>


        <!-- FLORES QUE CAEN -->
        <div id="flores-caidas"></div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
